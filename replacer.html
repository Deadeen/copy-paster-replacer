<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Code Replacer</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --accent-hover: #005f9e;
            --danger-color: #f14c4c;
            --success-color: #89d185;
            --border-color: #3e3e42;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: #c93c3c; }
        .btn-success { background-color: var(--success-color); color: #1e1e1e; }
        .paste-btn { 
            width: 100%; 
            padding: 10px; 
            font-size: 1rem; 
            margin-top: 5px; 
            margin-bottom: 5px; 
            border-radius: 4px; 
            color: white; 
            border: 1px solid #ffffff44;
            cursor: pointer;
            transition: all 0.3s;
        }
        .paste-btn:hover { filter: brightness(1.2); }
        
        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 10px;
            resize: horizontal;
            min-width: 250px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        
        .replacement-block {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .textareas {
            display: flex;
            gap: 10px;
        }
        .textarea-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .textarea-container label {
            font-size: 0.85rem;
            color: #9cdcfe;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        
        /* Fixed VS Code Editor & Scrollbar Styles */
        .preview-container {
            flex: 1;
            position: relative;
            display: flex;
            min-height: 0;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #1e1e1e;
            overflow: hidden;
        }
        .preview-box {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: auto;
            position: relative;
        }
        .preview-box::-webkit-scrollbar {
            width: 14px;
            height: 14px;
            background: #1e1e1e;
            border-left: 1px solid #3e3e42;
        }
        .preview-box::-webkit-scrollbar-thumb {
            background: #424242;
            border: 2px solid #1e1e1e; 
            border-radius: 7px;
        }
        .preview-box::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }
        .dir-files-pane {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
            max-height: 140px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 4px;
        }
        .dir-file-item {
            padding: 5px 8px;
            font-size: 0.85rem;
            font-family: monospace;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            border: 1px solid #333;
        }
        .dir-file-item:hover {
            border-color: var(--accent-color);
        }
        .dir-file-item.active {
            border-color: var(--accent-color);
            background: #2a2d2e;
        }
        .code-container {
            position: relative;
            min-width: 100%;
            width: max-content;
            min-height: max-content;
        }
        .code-layer {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre !important;
            word-wrap: normal !important;
            tab-size: 4;
            margin: 0;
            padding: 15px; /* Unified padding in the layer to perfectly sync scroll/overlay */
            box-sizing: border-box;
            display: block;
        }
        #highlightLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            color: transparent; 
        }
        #syntaxLayer {
            position: relative;
            z-index: 1;
        }
        /* Reset highlight.js background to stay clean */
        .hljs { background: transparent !important; padding: 15px !important; }
        
        .marker-track {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 14px;
            pointer-events: none;
            z-index: 10;
        }
        .scroll-marker {
            position: absolute;
            right: 2px;
            width: 10px;
            height: 4px;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        .status-log {
            margin-top: 10px;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            max-height: 100px;
            overflow-y: auto;
        }
        .log-success { color: var(--success-color); }
        .log-error { color: var(--danger-color); }
    </style>
    <!-- Add Highlight.js for VS Code Colors -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

    <h1>Batch Code Replacer</h1>
    
    <div class="controls" style="margin-bottom: 10px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="display: flex; gap: 10px;">
                <button onclick="loadFile()" id="loadFileBtn" title="Click to browse, or drag and drop a file here">📂 Load File (Click or Drag & Drop)</button>
                <button onclick="loadDirectory()" id="loadDirBtn" style="background-color: #2a9d8f;">📁 Load Whole Directory</button>
                <button onclick="applyChanges()" class="btn-success">▶ Apply All Changes</button>
            </div>
            <div id="fileLocation" style="font-size: 0.8rem; color: #888888; font-family: monospace; padding-left: 2px;"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div id="blocksContainer">
                <!-- Replacement blocks will be injected here -->
            </div>
        </div>
        
        <div class="right-panel">
            <div id="dirFilesPane" class="dir-files-pane"></div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px;">
                <label style="color: #9cdcfe;" id="previewTitle">File Preview (Read Only)</label>
                <div style="display: flex; gap: 10px;">
                    <button onclick="downloadFile()" id="downloadBtn" class="paste-btn" style="display: none; background-color: #d1691f; margin:0; width: auto; padding: 4px 12px; font-size: 0.8rem; font-weight: bold;">⬇ Save File to Same Folder</button>
                    <button onclick="copyWholeFile()" class="paste-btn" style="background-color: var(--accent-color); margin:0; width: auto; padding: 4px 12px; font-size: 0.8rem; font-weight: bold;">📋 Copy Entire File</button>
                </div>
            </div>
            <div class="preview-container">
                <div id="previewBox" class="preview-box">
                    <div class="code-container">
                        <!-- Dual-layer text to allow flawless syntax highlighting AND chunk backgrounds -->
                        <div id="highlightLayer" class="code-layer"></div>
                        <code id="syntaxLayer" class="code-layer hljs">Upload a file to see its content here...</code>
                    </div>
                </div>
                <div id="markerTrack" class="marker-track"></div>
            </div>
            <div id="statusLog" class="status-log">Status: Waiting for file...</div>
        </div>
    </div>

    <script>
        let fileContent = "";
        let originalFileName = "updated_file.txt";
        let blockCount = 0;
        let currentFileHandle = null; 
        let isDirectoryMode = false;
        let loadedDirectoryFiles = []; // Array of { path, name, content, handle, modified }
        let selectedFileIndex = -1;
        
        // Distinct colors for each chunk
        const chunkColors = ['#007acc', '#d1691f', '#2a9d8f', '#e76f51', '#9b5de5', '#f15bb5', '#00bbf9', '#00f5d4'];

        function normalizeText(text) {
            return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Load single file via Button Click
        async function loadFile() {
            try {
                const [fileHandle] = await window.showOpenFilePicker();
                currentFileHandle = fileHandle; 
                isDirectoryMode = false;
                loadedDirectoryFiles = [];
                document.getElementById('dirFilesPane').style.display = 'none';
                
                const file = await fileHandle.getFile();
                originalFileName = file.name;
                fileContent = normalizeText(await file.text());
                
                document.getElementById('previewTitle').innerText = `File Preview: ${originalFileName}`;
                document.getElementById('fileLocation').innerText = `Location: (Local File) / ${originalFileName}`;
                updateHighlights(); 
                logMsg(`Loaded single file: ${originalFileName} (${fileContent.split('\n').length} lines)`, 'log-success');
                document.getElementById('downloadBtn').style.display = 'inline-block';
                document.getElementById('downloadBtn').innerText = '⬇ Save File to Same Folder';
            } catch (err) {
                if (err.name !== 'AbortError') logMsg('Error loading file.', 'log-error');
            }
        }

        // Recursive directory scanner
        async function scanDirectoryRecursive(dirHandle, currentPath = "") {
            const skipDirs = new Set(['.git', 'node_modules', '.vscode', '.venv', '__pycache__', 'dist', 'build']);
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'directory') {
                    if (!skipDirs.has(entry.name)) {
                        await scanDirectoryRecursive(entry, `${currentPath}${entry.name}/`);
                    }
                } else if (entry.kind === 'file') {
                    try {
                        const file = await entry.getFile();
                        // Filter for common text/code extensions or small files
                        const text = await file.text();
                        loadedDirectoryFiles.push({
                            path: `${currentPath}${entry.name}`,
                            name: entry.name,
                            content: normalizeText(text),
                            handle: entry,
                            modified: false
                        });
                    } catch (e) {
                        // Skip binary or unreadable files
                    }
                }
            }
        }

        // Load entire directory
        async function loadDirectory() {
            try {
                const dirHandle = await window.showDirectoryPicker();
                loadedDirectoryFiles = [];
                isDirectoryMode = true;
                currentFileHandle = dirHandle;
                
                logMsg(`Scanning directory: ${dirHandle.name}...`);
                await scanDirectoryRecursive(dirHandle, "");
                
                document.getElementById('fileLocation').innerText = `Directory: ${dirHandle.name} (${loadedDirectoryFiles.length} text files indexed)`;
                logMsg(`Loaded directory "${dirHandle.name}": indexed ${loadedDirectoryFiles.length} readable files.`, 'log-success');
                
                if (loadedDirectoryFiles.length > 0) {
                    selectDirectoryFile(0);
                    renderDirectoryFilesList();
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                    document.getElementById('downloadBtn').innerText = '⬇ Save All Modified Files';
                }
            } catch (err) {
                if (err.name !== 'AbortError') logMsg('Error loading directory.', 'log-error');
            }
        }

        function selectDirectoryFile(index) {
            if (index < 0 || index >= loadedDirectoryFiles.length) return;
            selectedFileIndex = index;
            const fileItem = loadedDirectoryFiles[index];
            fileContent = fileItem.content;
            originalFileName = fileItem.name;
            document.getElementById('previewTitle').innerText = `File Preview: ${fileItem.path}`;
            document.getElementById('fileLocation').innerText = `Location: ${fileItem.path}`;
            updateHighlights();
            renderDirectoryFilesList();
        }

        function renderDirectoryFilesList() {
            const pane = document.getElementById('dirFilesPane');
            if (!isDirectoryMode || loadedDirectoryFiles.length === 0) {
                pane.style.display = 'none';
                return;
            }
            pane.style.display = 'flex';
            pane.innerHTML = '';
            
            loadedDirectoryFiles.forEach((fileItem, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `dir-file-item ${idx === selectedFileIndex ? 'active' : ''}`;
                itemDiv.onclick = () => selectDirectoryFile(idx);
                
                const modTag = fileItem.modified ? `<span style="color: var(--success-color); font-weight: bold;">[Modified]</span>` : `<span style="color: #666;">[Unchanged]</span>`;
                itemDiv.innerHTML = `<span>📄 ${escapeHTML(fileItem.path)}</span> ${modTag}`;
                pane.appendChild(itemDiv);
            });
        }

        // Add a new Search/Replace Block 
        function addBlock() {
            blockCount++;
            const blockId = `block-${blockCount}`;
            const color = chunkColors[(blockCount - 1) % chunkColors.length];
            const activeBgColor = color + '40'; 
            
            const defaultBgColor = '#1e1e1e';
            const defaultBorderColor = '#3e3e42';
            const defaultTextColor = '#888888';
            
            const html = `
                <div class="replacement-block" id="${blockId}" data-color="${color}" data-active-bg="${activeBgColor}" style="background-color: ${defaultBgColor}; border-left: 6px solid ${defaultBorderColor}; transition: all 0.3s; opacity: 0.6;">
                    <div class="block-header">
                        <span class="chunk-title" style="color: ${defaultTextColor}; font-size: 1.1em; transition: color 0.3s;">Update Chunk #${blockCount}</span>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="chunk-warnings" style="font-size: 0.85em; color: var(--danger-color); font-weight: normal; display: none;"></span>
                            <span class="chunk-diff" style="font-size: 0.85em; color: #888888; font-weight: normal; display: none;"></span>
                            <button class="btn-danger remove-btn" onclick="removeBlock('${blockId}')" style="opacity: 0.3; transition: opacity 0.3s;">Remove</button>
                        </div>
                    </div>
                    <div class="textareas">
                        <div class="textarea-container">
                            <label>Find Code:</label>
                            <button class="paste-btn find-paste-btn" onclick="pasteClipboard(this.nextElementSibling, '${blockId}')" style="background-color: #333333; color: #888888; opacity: 0.5;">📋 Paste Clipboard Here</button>
                            <textarea class="find-text" placeholder="Paste the old code here..." oninput="updateBlockState('${blockId}'); updateHighlights('${blockId}');"></textarea>
                        </div>
                        <div class="textarea-container">
                            <label>Replace With:</label>
                            <button class="paste-btn replace-paste-btn" onclick="pasteClipboard(this.nextElementSibling, '${blockId}')" style="background-color: #333333; color: #888888; opacity: 0.5;">📋 Paste Clipboard Here</button>
                            <textarea class="replace-text" placeholder="Paste the updated code here..." oninput="updateBlockState('${blockId}');"></textarea>
                        </div>
                    </div>
                    <div class="block-status" style="font-size: 0.85em; margin-top: 5px;"></div>
                </div>
            `;
            document.getElementById('blocksContainer').insertAdjacentHTML('beforeend', html);
        }

        // Fast approximate diff calculation for performance
        function calculateDiffPercentage(str1, str2) {
            if (str1 === str2) return 0;
            if (!str1 || !str2) return 100;
            const arr1 = str1.split('\n');
            const arr2 = str2.split('\n');
            let diffs = 0;
            const maxLen = Math.max(arr1.length, arr2.length);
            for (let i = 0; i < maxLen; i++) {
                if (arr1[i] !== arr2[i]) diffs++;
            }
            return Math.round((diffs / maxLen) * 100);
        }

        // Dynamically activate color and fade when text is entered, and spawn next block
        function updateBlockState(blockId) {
            const block = document.getElementById(blockId);
            if (!block) return;
            const findText = block.querySelector('.find-text').value;
            const replaceText = block.querySelector('.replace-text').value;
            const color = block.dataset.color;
            const activeBg = block.dataset.activeBg;
            
            const title = block.querySelector('.chunk-title');
            const findPasteBtn = block.querySelector('.find-paste-btn');
            const replacePasteBtn = block.querySelector('.replace-paste-btn');
            const removeBtn = block.querySelector('.remove-btn');
            const diffSpan = block.querySelector('.chunk-diff');
            const warnSpan = block.querySelector('.chunk-warnings');
            
            const hasAnyText = findText.length > 0 || replaceText.length > 0;

            // Diff Calculation
            if (findText && replaceText) {
                const diffPct = calculateDiffPercentage(findText, replaceText);
                diffSpan.style.display = 'inline';
                if (diffPct === 0) {
                    diffSpan.innerText = 'Identical';
                    diffSpan.style.color = 'var(--success-color)';
                } else {
                    diffSpan.innerText = `${diffPct}% difference`;
                    diffSpan.style.color = '#888888';
                }
            } else {
                diffSpan.style.display = 'none';
            }

            // Duplicate Check
            warnSpan.style.display = 'none';
            if (findText) {
                const allBlocks = document.querySelectorAll('.replacement-block');
                for (let i = 0; i < allBlocks.length; i++) {
                    if (allBlocks[i].id === blockId) break; // Stop checking at current block
                    const prevFindText = allBlocks[i].querySelector('.find-text').value;
                    if (findText === prevFindText && prevFindText.length > 0) {
                        const prevTitle = allBlocks[i].querySelector('.chunk-title').innerText.replace('Update ', '').toLowerCase();
                        warnSpan.innerText = `(same text already existed in ${prevTitle})`;
                        warnSpan.style.display = 'inline';
                        break;
                    }
                }
            }
            
            // Chunk overall state (Un-fade the chunk block itself)
            if (hasAnyText) {
                block.style.backgroundColor = activeBg;
                block.style.borderLeft = `6px solid ${color}`;
                block.style.opacity = '1';
                title.style.color = color;
                removeBtn.style.opacity = '1';
                
                // Auto-spawn logic: If this is the very last block and we just started typing in it, spawn a new faded one below it
                const allBlocks = document.querySelectorAll('.replacement-block');
                if (allBlocks[allBlocks.length - 1].id === blockId) {
                    addBlock();
                    // Auto-scroll this newly active block to the top of the view so the next one is visible
                    block.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            } else {
                block.style.backgroundColor = '#1e1e1e';
                block.style.borderLeft = '6px solid #3e3e42';
                block.style.opacity = '0.6';
                title.style.color = '#888888';
                removeBtn.style.opacity = '0.3';
            }

            // Independent button states (Faded until their specific text box has content)
            if (findText.length > 0) {
                findPasteBtn.style.backgroundColor = color;
                findPasteBtn.style.color = "white";
                findPasteBtn.style.opacity = "1";
            } else {
                findPasteBtn.style.backgroundColor = '#333333';
                findPasteBtn.style.color = '#888888';
                findPasteBtn.style.opacity = "0.5";
            }

            if (replaceText.length > 0) {
                replacePasteBtn.style.backgroundColor = color;
                replacePasteBtn.style.color = "white";
                replacePasteBtn.style.opacity = "1";
            } else {
                replacePasteBtn.style.backgroundColor = '#333333';
                replacePasteBtn.style.color = '#888888';
                replacePasteBtn.style.opacity = "0.5";
            }
        }

        // Paste from clipboard logic
        async function pasteClipboard(targetTextarea, blockId) {
            try {
                const text = await navigator.clipboard.readText();
                targetTextarea.value = text;
                updateBlockState(blockId);
                updateHighlights(blockId); 
            } catch (err) {
                if (window.location.protocol === 'file:') {
                    alert('Clipboard Prompt Blocked!\n\nBrowsers will not save clipboard permissions for local "file://" URLs. It will ask every single time.\n\nTO FIX THIS: Open this file in VS Code, right-click, and select "Open with Live Server". This runs it as an online file (http://127.0.0.1) and the browser will permanently save your permission.');
                } else {
                    alert('Clipboard access denied or empty. Please allow permissions or use Ctrl+V.');
                }
            }
        }

        // Dual-Layer VS Code Editor Highlights & Scrollbar Markers
        function updateHighlights(activeBlockId = null) {
            const syntaxEl = document.getElementById('syntaxLayer');
            const highlightEl = document.getElementById('highlightLayer');
            const trackEl = document.getElementById('markerTrack');
            trackEl.innerHTML = ''; 

            if (!fileContent) {
                syntaxEl.textContent = "Upload a file to see its content here...";
                highlightEl.innerHTML = "";
                return;
            }
            
            // 1. Process VS Code Syntax Highlighting (Base Layer)
            syntaxEl.textContent = fileContent;
            syntaxEl.className = "code-layer hljs"; // Reset classes so Highlight.js re-evaluates
            if (typeof hljs !== 'undefined') hljs.highlightElement(syntaxEl);

            // 2. Process Chunk Colors (Overlay Layer)
            let displayContent = escapeHTML(fileContent);
            const blocks = document.querySelectorAll('.replacement-block');
            
            blocks.forEach((block) => {
                const findText = normalizeText(block.querySelector('.find-text').value);
                const color = block.dataset.color;
                const blockId = block.id; // Get exact block ID for auto-scrolling
                const markBg = color + '66'; // High visibility tint for exact text match in editor
                
                if (findText.trim().length > 0) {
                    const escapedFindText = escapeHTML(findText);
                    // Overlay text is totally transparent, leaving only the perfect chunk background colors visible over the syntax highlighted text beneath it.
                    displayContent = displayContent.split(escapedFindText).join(`<mark data-color="${color}" data-block-id="${blockId}" style="background-color: ${markBg}; color: transparent;">${escapedFindText}</mark>`);
                }
            });
            
            highlightEl.innerHTML = displayContent;

            // Generate Scrollbar Markers exactly inside the track
            const marks = highlightEl.querySelectorAll('mark');
            marks.forEach(mark => {
                const ratio = mark.offsetTop / highlightEl.scrollHeight;
                const marker = document.createElement('div');
                marker.className = 'scroll-marker';
                marker.style.top = (ratio * 100) + '%';
                marker.style.backgroundColor = mark.dataset.color;
                trackEl.appendChild(marker);
            });

            // Auto-scroll file preview to the newly updated/pasted chunk
            if (activeBlockId) {
                const activeMark = highlightEl.querySelector(`mark[data-block-id="${activeBlockId}"]`);
                if (activeMark) {
                    const previewBox = document.getElementById('previewBox');
                    previewBox.scrollTo({
                        top: activeMark.offsetTop - 50, // 50px buffer to keep it clearly visible below the top edge
                        behavior: 'smooth'
                    });
                }
            }
        }

        // Remove a block
        function removeBlock(blockId) {
            const allBlocks = document.querySelectorAll('.replacement-block');
            if (allBlocks.length <= 1) {
                alert("You cannot remove the last remaining chunk. Simply delete its text to clear it.");
                return;
            }
            document.getElementById(blockId).remove();
            updateHighlights(); 
        }

        // Apply all changes sequentially (supports single file and full directory)
        function applyChanges() {
            if (!isDirectoryMode && !fileContent) {
                alert("Please upload a file or directory first!");
                return;
            }

            const blocks = Array.from(document.querySelectorAll('.replacement-block')).map(block => ({
                findText: normalizeText(block.querySelector('.find-text').value),
                replaceText: normalizeText(block.querySelector('.replace-text').value),
                statusDiv: block.querySelector('.block-status')
            }));

            clearLog();
            logMsg("Applying changes...");

            if (!isDirectoryMode) {
                let updatedContent = fileContent;
                let successCount = 0;
                let failCount = 0;

                blocks.forEach((b, index) => {
                    if (!b.findText && !b.replaceText) {
                        b.statusDiv.innerHTML = `<span style="color: #888888;">Ignored: Chunk is empty.</span>`;
                        return;
                    }
                    if (!b.findText) {
                        b.statusDiv.innerHTML = `<span class="log-error">Skipped: Find field empty.</span>`;
                        failCount++;
                        return;
                    }
                    if (updatedContent.includes(b.findText)) {
                        updatedContent = updatedContent.split(b.findText).join(b.replaceText);
                        b.statusDiv.innerHTML = `<span class="log-success">✓ Successfully replaced in file.</span>`;
                        successCount++;
                        logMsg(`Chunk #${index + 1}: Replaced in ${originalFileName}`, 'log-success');
                    } else {
                        b.statusDiv.innerHTML = `<span class="log-error">✗ Not found in file.</span>`;
                        failCount++;
                    }
                });

                fileContent = updatedContent;
                updateHighlights();
                logMsg(`Finished: ${successCount} applied, ${failCount} failed.`);
            } else {
                let totalFilesModified = 0;
                let totalReplacements = 0;

                loadedDirectoryFiles.forEach(fileItem => {
                    let text = fileItem.content;
                    let fileChanged = false;

                    blocks.forEach((b, index) => {
                        if (b.findText && text.includes(b.findText)) {
                            text = text.split(b.findText).join(b.replaceText);
                            fileChanged = true;
                            totalReplacements++;
                            logMsg(`Chunk #${index + 1} matched in: ${fileItem.path}`, 'log-success');
                        }
                    });

                    if (fileChanged) {
                        fileItem.content = text;
                        fileItem.modified = true;
                        totalFilesModified++;
                    }
                });

                if (selectedFileIndex >= 0) {
                    fileContent = loadedDirectoryFiles[selectedFileIndex].content;
                    updateHighlights();
                }
                renderDirectoryFilesList();
                logMsg(`Directory scan complete: ${totalReplacements} changes made across ${totalFilesModified} files.`, 'log-success');
            }
        }

        // Download or Overwrite modified files (single or batch directory save)
        async function downloadFile() {
            if (!isDirectoryMode) {
                if (!fileContent) return;
                try {
                    const options = { suggestedName: originalFileName };
                    if (currentFileHandle) options.startIn = currentFileHandle;
                    const handle = await window.showSaveFilePicker(options);
                    const writable = await handle.createWritable();
                    await writable.write(fileContent);
                    await writable.close();
                    logMsg('File saved exactly in directory!', 'log-success');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        const blob = new Blob([fileContent], { type: "text/plain" });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = originalFileName; 
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                }
            } else {
                const modifiedFiles = loadedDirectoryFiles.filter(f => f.modified);
                if (modifiedFiles.length === 0) {
                    alert("No modified files in directory to save.");
                    return;
                }
                try {
                    for (const fileItem of modifiedFiles) {
                        const writable = await fileItem.handle.createWritable();
                        await writable.write(fileItem.content);
                        await writable.close();
                        logMsg(`Saved: ${fileItem.path}`, 'log-success');
                    }
                    logMsg(`Successfully wrote all ${modifiedFiles.length} modified files to disk!`, 'log-success');
                } catch (err) {
                    logMsg(`Error saving directory files: ${err.message}`, 'log-error');
                }
            }
        }

        // Copy Entire File Logic
        async function copyWholeFile() {
            if (!fileContent) {
                alert("No file loaded to copy!");
                return;
            }
            try {
                await navigator.clipboard.writeText(fileContent);
                logMsg('✓ Entire file content copied to clipboard!', 'log-success');
            } catch (err) {
                alert('Clipboard access denied. Please allow permissions.');
            }
        }

        function logMsg(msg, className = '') {
            const logDiv = document.getElementById('statusLog');
            logDiv.innerHTML += `<div class="${className}">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('statusLog').innerHTML = '';
        }

        // Initialize App & Setup Drag-and-Drop
        window.onload = function() {
            // Only add 1 faded chunk initially, it will auto-spawn more when typed in
            addBlock();

            // Drag and Drop Load Listeners
            const loadBtn = document.getElementById('loadFileBtn');
            loadBtn.addEventListener('dragover', (e) => { 
                e.preventDefault(); 
                loadBtn.style.transform = 'scale(1.05)'; 
                loadBtn.style.border = '2px dashed #fff'; 
            });
            loadBtn.addEventListener('dragleave', (e) => { 
                e.preventDefault(); 
                loadBtn.style.transform = 'none'; 
                loadBtn.style.border = 'none'; 
            });
            loadBtn.addEventListener('drop', async (e) => {
                e.preventDefault();
                loadBtn.style.transform = 'none';
                loadBtn.style.border = 'none';
                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    originalFileName = file.name;
                    fileContent = normalizeText(await file.text());
                    currentFileHandle = null; // Can't map handles strictly from drag events yet
                    
                    document.getElementById('fileLocation').innerText = `Location: (Drag & Drop) / ${originalFileName}`;
                    updateHighlights(); 
                    logMsg(`Loaded via Drag & Drop: ${originalFileName} (${fileContent.split('\n').length} lines)`, 'log-success');
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                }
            });
        };
    </script>
</body>
</html>
