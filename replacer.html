<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Code Replacer</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --accent-hover: #005f9e;
            --danger-color: #f14c4c;
            --success-color: #89d185;
            --border-color: #3e3e42;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: #c93c3c; }
        .btn-success { background-color: var(--success-color); color: #1e1e1e; }
        .paste-btn { 
            width: 100%; 
            padding: 10px; 
            font-size: 1rem; 
            margin-top: 5px; 
            margin-bottom: 5px; 
            border-radius: 4px; 
            color: white; 
            border: 1px solid #ffffff44;
            cursor: pointer;
            transition: all 0.3s;
        }
        .paste-btn:hover { filter: brightness(1.2); }
        
        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 10px;
            resize: horizontal;
            min-width: 250px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        
        .replacement-block {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .textareas {
            display: flex;
            gap: 10px;
        }
        .textarea-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .textarea-container label {
            font-size: 0.85rem;
            color: #9cdcfe;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        .preview-container {
            flex: 1;
            position: relative;
            display: flex;
            min-height: 0;
        }
        .preview-box {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            box-sizing: border-box;
            white-space: pre;
            overflow: auto;
            resize: both;
            max-width: 100%;
            max-height: 100%;
        }
        .marker-track {
            position: absolute;
            right: 20px;
            top: 10px;
            bottom: 10px;
            width: 8px;
            pointer-events: none;
            z-index: 10;
        }
        .scroll-marker {
            position: absolute;
            right: 0;
            width: 100%;
            height: 4px;
            border-radius: 2px;
        }
        .status-log {
            margin-top: 10px;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            max-height: 100px;
            overflow-y: auto;
        }
        .log-success { color: var(--success-color); }
        .log-error { color: var(--danger-color); }
    </style>
</head>
<body>

    <h1>Batch Code Replacer</h1>
    
    <div class="controls">
        <button onclick="loadFile()" id="loadFileBtn">📂 Load File</button>
        <button onclick="applyChanges()" class="btn-success">▶ Apply All Changes</button>
        <button onclick="downloadFile()" id="downloadBtn" style="display: none;">⬇ Save File to Same Folder</button>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div id="blocksContainer">
                <!-- Replacement blocks will be injected here -->
            </div>
            <button onclick="addBlock()" style="width: 100%; padding: 15px; background-color: #333; color: #ccc; border: 2px dashed #555; border-radius: 6px; font-size: 1.1rem; margin-bottom: 20px;">+ Add Additional Replacement Block</button>
        </div>
        
        <div class="right-panel">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px;">
                <label style="color: #9cdcfe;">File Preview (Read Only)</label>
                <button onclick="copyWholeFile()" class="paste-btn" style="background-color: var(--accent-color); margin:0;">📋 Copy Entire File</button>
            </div>
            <div class="preview-container">
                <div id="preview" class="preview-box">Upload a file to see its content here...</div>
                <div id="markerTrack" class="marker-track"></div>
            </div>
            <div id="statusLog" class="status-log">Status: Waiting for file...</div>
        </div>
    </div>

    <script>
        let fileContent = "";
        let originalFileName = "updated_file.txt";
        let blockCount = 0;
        let currentFileHandle = null; // Store handle so we can save back to exact folder
        
        // Distinct colors for each chunk
        const chunkColors = ['#007acc', '#d1691f', '#2a9d8f', '#e76f51', '#9b5de5', '#f15bb5', '#00bbf9', '#00f5d4'];

        // Normalize line endings to avoid invisible mismatch errors
        function normalizeText(text) {
            return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        }

        // Escapes HTML so code doesn't render as actual webpage elements in the preview
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Modern File API to Load File and remember its specific folder location
        async function loadFile() {
            try {
                const [fileHandle] = await window.showOpenFilePicker();
                currentFileHandle = fileHandle; // Save handle for later
                const file = await fileHandle.getFile();
                originalFileName = file.name;
                fileContent = normalizeText(await file.text());
                
                updateHighlights(); 
                logMsg(`Loaded file: ${originalFileName} (${fileContent.split('\n').length} lines)`, 'log-success');
                document.getElementById('downloadBtn').style.display = 'inline-block';
            } catch (err) {
                // User cancelled the file picker
                if (err.name !== 'AbortError') logMsg('Error loading file.', 'log-error');
            }
        }

        // Add a new Search/Replace Block with Colors and Paste Buttons
        function addBlock() {
            blockCount++;
            const blockId = `block-${blockCount}`;
            const color = chunkColors[(blockCount - 1) % chunkColors.length];
            const activeBgColor = color + '1A'; 
            
            // Initial faded/black state
            const defaultBgColor = '#1e1e1e';
            const defaultBorderColor = '#3e3e42';
            const defaultTextColor = '#888888';
            
            const html = `
                <div class="replacement-block" id="${blockId}" data-color="${color}" data-active-bg="${activeBgColor}" style="background-color: ${defaultBgColor}; border-left: 6px solid ${defaultBorderColor}; transition: all 0.3s;">
                    <div class="block-header">
                        <span class="chunk-title" style="color: ${defaultTextColor}; font-size: 1.1em; transition: color 0.3s;">Update Chunk #${blockCount}</span>
                        <button class="btn-danger" onclick="removeBlock('${blockId}')">Remove</button>
                    </div>
                    <div class="textareas">
                        <div class="textarea-container">
                            <label>Find Code:</label>
                            <button class="paste-btn" onclick="pasteClipboard(this.nextElementSibling, '${blockId}')" style="background-color: #333333; color: #888888;">📋 Paste Clipboard Here</button>
                            <textarea class="find-text" placeholder="Paste the old code here..." oninput="updateBlockState('${blockId}'); updateHighlights();"></textarea>
                        </div>
                        <div class="textarea-container">
                            <label>Replace With:</label>
                            <button class="paste-btn" onclick="pasteClipboard(this.nextElementSibling, '${blockId}')" style="background-color: #333333; color: #888888;">📋 Paste Clipboard Here</button>
                            <textarea class="replace-text" placeholder="Paste the updated code here..." oninput="updateBlockState('${blockId}');"></textarea>
                        </div>
                    </div>
                    <div class="block-status" style="font-size: 0.85em; margin-top: 5px;"></div>
                </div>
            `;
            document.getElementById('blocksContainer').insertAdjacentHTML('beforeend', html);
        }

        // Dynamically activate color when text is entered
        function updateBlockState(blockId) {
            const block = document.getElementById(blockId);
            if (!block) return;
            const findText = block.querySelector('.find-text').value;
            const replaceText = block.querySelector('.replace-text').value;
            const color = block.dataset.color;
            const activeBg = block.dataset.activeBg;
            
            const title = block.querySelector('.chunk-title');
            const pasteBtns = block.querySelectorAll('.paste-btn');
            
            if (findText.length > 0 || replaceText.length > 0) {
                block.style.backgroundColor = activeBg;
                block.style.borderLeft = `6px solid ${color}`;
                title.style.color = color;
                pasteBtns.forEach(btn => {
                    btn.style.backgroundColor = color;
                    btn.style.color = "white";
                });
            } else {
                block.style.backgroundColor = '#1e1e1e';
                block.style.borderLeft = '6px solid #3e3e42';
                title.style.color = '#888888';
                pasteBtns.forEach(btn => {
                    btn.style.backgroundColor = '#333333';
                    btn.style.color = '#888888';
                });
            }
        }

        // Paste from clipboard logic
        async function pasteClipboard(targetTextarea, blockId) {
            try {
                const text = await navigator.clipboard.readText();
                targetTextarea.value = text;
                updateBlockState(blockId);
                updateHighlights(); 
            } catch (err) {
                if (window.location.protocol === 'file:') {
                    alert('Clipboard Prompt Blocked!\n\nBrowsers will not save clipboard permissions for local "file://" URLs. It will ask every single time.\n\nTO FIX THIS: Open this file in VS Code, right-click, and select "Open with Live Server". This runs it as an online file (http://127.0.0.1) and the browser will permanently save your permission.');
                } else {
                    alert('Clipboard access denied or empty. Please allow permissions or use Ctrl+V.');
                }
            }
        }

        // Live real-time highlighting logic & Scrollbar markers
        function updateHighlights() {
            const previewEl = document.getElementById('preview');
            const trackEl = document.getElementById('markerTrack');
            trackEl.innerHTML = ''; // Clear old markers

            if (!fileContent) {
                previewEl.innerHTML = "Upload a file to see its content here...";
                return;
            }
            
            let displayContent = escapeHTML(fileContent);
            const blocks = document.querySelectorAll('.replacement-block');
            
            blocks.forEach((block) => {
                const findText = normalizeText(block.querySelector('.find-text').value);
                const color = block.dataset.color;
                
                if (findText.trim().length > 0) {
                    const escapedFindText = escapeHTML(findText);
                    // Wrap found text in a styled <mark> tag using the chunk's color
                    displayContent = displayContent.split(escapedFindText).join(`<mark style="background-color: ${color}; color: white;">${escapedFindText}</mark>`);
                }
            });
            
            previewEl.innerHTML = displayContent;

            // Generate Scrollbar Markers
            const marks = previewEl.querySelectorAll('mark');
            marks.forEach(mark => {
                const ratio = mark.offsetTop / previewEl.scrollHeight;
                const marker = document.createElement('div');
                marker.className = 'scroll-marker';
                marker.style.top = (ratio * 100) + '%';
                marker.style.backgroundColor = mark.style.backgroundColor;
                trackEl.appendChild(marker);
            });
        }

        // Remove a block
        function removeBlock(blockId) {
            document.getElementById(blockId).remove();
            updateHighlights(); 
        }

        // Apply all changes sequentially
        function applyChanges() {
            if (!fileContent) {
                alert("Please upload a file first!");
                return;
            }

            let updatedContent = fileContent;
            const blocks = document.querySelectorAll('.replacement-block');
            let successCount = 0;
            let failCount = 0;
            let ignoreCount = 0;
            
            clearLog();
            logMsg("Applying changes...");

            blocks.forEach((block, index) => {
                const findText = normalizeText(block.querySelector('.find-text').value);
                const replaceText = normalizeText(block.querySelector('.replace-text').value);
                const statusDiv = block.querySelector('.block-status');

                // Completely ignore if both fields are empty
                if (!findText && !replaceText) {
                    statusDiv.innerHTML = `<span style="color: #888888;">Ignored: Chunk is empty.</span>`;
                    logMsg(`Chunk #${index + 1} is empty, ignored.`);
                    ignoreCount++;
                    return;
                }

                if (!findText) {
                    statusDiv.innerHTML = `<span class="log-error">Skipped: Find field is empty.</span>`;
                    failCount++;
                    logMsg(`Chunk #${index + 1}: Find field empty, but replace has text!`, 'log-error');
                    return;
                }

                if (updatedContent.includes(findText)) {
                    updatedContent = updatedContent.split(findText).join(replaceText);
                    statusDiv.innerHTML = `<span class="log-success">✓ Successfully replaced in file.</span>`;
                    successCount++;
                    logMsg(`Chunk #${index + 1}: Replaced successfully.`, 'log-success');
                } else {
                    statusDiv.innerHTML = `<span class="log-error">✗ Not found in file. Check for extra spaces or missing lines.</span>`;
                    failCount++;
                    logMsg(`Chunk #${index + 1}: Search string not found!`, 'log-error');
                }
            });

            fileContent = updatedContent;
            updateHighlights();
            logMsg(`Finished: ${successCount} applied, ${failCount} failed, ${ignoreCount} ignored.`);
        }

        // Download or Overwrite the modified file using File System Access API
        async function downloadFile() {
            if (!fileContent) return;
            
            try {
                const options = {
                    suggestedName: originalFileName,
                };
                // If we loaded via the file picker, we can tell the save dialog to start in that EXACT directory
                if (currentFileHandle) {
                    options.startIn = currentFileHandle;
                }
                const handle = await window.showSaveFilePicker(options);
                const writable = await handle.createWritable();
                await writable.write(fileContent);
                await writable.close();
                logMsg('File saved exactly in directory!', 'log-success');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    // Fallback for older browsers
                    const blob = new Blob([fileContent], { type: "text/plain" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = originalFileName; 
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            }
        }

        // Copy Entire File Logic
        async function copyWholeFile() {
            if (!fileContent) {
                alert("No file loaded to copy!");
                return;
            }
            try {
                await navigator.clipboard.writeText(fileContent);
                logMsg('✓ Entire file content copied to clipboard!', 'log-success');
            } catch (err) {
                alert('Clipboard access denied. Please allow permissions.');
            }
        }

        // Logging utility
        function logMsg(msg, className = '') {
            const logDiv = document.getElementById('statusLog');
            logDiv.innerHTML += `<div class="${className}">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('statusLog').innerHTML = '';
        }

        // Initialize with 10 blocks
        window.onload = function() {
            for (let i = 0; i < 10; i++) {
                addBlock();
            }
        };
    </script>
</body>
</html>
